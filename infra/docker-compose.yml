version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: calibiai
      POSTGRES_USER: calibiai
      POSTGRES_PASSWORD: calibiai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  redpanda:
    image: redpandadata/redpanda:v23.3
    command: ["redpanda","start","--smp 1","--overprovisioned","--kafka-addr 0.0.0.0:9092","--advertise-kafka-addr redpanda:9092"]
    ports: ["9092:9092"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: calibiai, MINIO_ROOT_PASSWORD: calibiai123 }
    ports: ["9000:9000","9001:9001"]
    volumes: ["miniodata:/data"]
  api:
    build: ../
    dockerfile: Dockerfile
    ports: ["4000:3000"]
    environment:
      DATABASE_URL: postgres://calibiai:calibiai@postgres:5432/calibiai
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    depends_on: [postgres, redis, redpanda, minio]
  frontend:
    build: ../
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
